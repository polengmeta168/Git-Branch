<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Page</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f5f5f5;
    color: #222;
    line-height: 1.6;
  }

  /* Nav bar */
  nav {
    background: #ffffff;
    border-bottom: 1px solid #e5e5e5;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  nav .logo {
    font-weight: 700;
    font-size: 18px;
    color: #1a1a1a;
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 20px;
  }

  nav ul li a {
    color: #444;
    font-size: 14px;
  }

  main {
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .container {
    background: #ffffff;
    border-radius: 10px;
    padding: 32px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    margin-bottom: 24px;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 12px;
    color: #1a1a1a;
  }

  h2 {
    font-size: 20px;
    margin-top: 24px;
    margin-bottom: 8px;
    color: #333;
  }

  p {
    margin-bottom: 12px;
  }

  ul.plain {
    margin-left: 20px;
    margin-bottom: 12px;
  }

  a {
    color: #2563eb;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  /* Cards grid */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
