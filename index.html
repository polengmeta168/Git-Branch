<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Page</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f5f5f5;
    color: #222;
    line-height: 1.6;
    padding: 40px 20px;
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 10px;
    padding: 32px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  h1 {
    font-size: 28px;
    margin-bottom: 12px;
    color: #1a1a1a;
  }

  h2 {
    font-size: 20px;
    margin-top: 24px;
    margin-bottom: 8px;
    color: #333;
  }

  p {
    margin-bottom: 12px;
  }

  ul {
    margin-left: 20px;
    margin-bottom: 12px;
  }

  a {
    color: #2563eb;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  button {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 16px;
  }

  button:hover {
    background-color: #1d4ed8;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Simple Page Title</h1>
    <p>This is a basic paragraph of text. Replace this with your own content.</p>

    <h2>Section Heading</h2>
    <ul>
      <li>First item</li>
      <li>Second item</li>
      <li>Third item</li>
    </ul>

    <button>Click Me</button>
  </div>

</body>
</html>
