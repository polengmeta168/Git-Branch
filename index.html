<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Page</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f5f5f5;
    color: #222;
    line-height: 1.6;
  }

  nav {
    background: #ffffff;
    border-bottom: 1px solid #e5e5e5;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  nav .logo { font-weight: 700; font-size: 18px; color: #1a1a1a; }
  nav ul { list-style: none; display: flex; gap: 20px; }
  nav ul li a { color: #444; font-size: 14px; }

  main { max-width: 700px; margin: 40px auto; padding: 0 20px; }

  .container {
    background: #ffffff;
    border-radius: 10px;
    padding: 32px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    margin-bottom: 24px;
  }

  h1 { font-size: 28px; margin-bottom: 12px; color: #1a1a1a; }
  h2 { font-size: 20px; margin-top: 24px; margin-bottom: 8px; color: #333; }
  p { margin-bottom: 12px; }
  ul.plain { margin-left: 20px; margin-bottom: 12px; }
  a { color: #2563eb; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }

  .card { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 16px; }
  .card h3 { font-size: 15px; margin-bottom: 6px; color: #1a1a1a; }
  .card p { font-size: 13px; color: #666; margin-bottom: 0; }

  form label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; margin-top: 14px; }
  form input, form textarea, form select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  form textarea { resize: vertical; min-height: 80px; }

  button, .btn {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 16px;
    display: inline-block;
  }
  button:hover, .btn:hover { background-color: #1d4ed8; }
  button.secondary { background-color: #eee; color: #333; margin-left: 8px; }
  button.secondary:hover { background-color: #ddd; }

  .badge {
    display: inline-block;
    background: #dbeafe;
    color: #1e40af;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .alert {
    background: #fef3c7;
    border-left: 4px solid #f59e0b;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
  }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; }

  footer { text-align: center; padding: 24px; font-size: 13px; color: #888; }
</style>
</head>
<body>

  <nav>
    <div class="logo">Simple Site</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <main>
    <div class="container">
      <span class="badge">New</span>
      <h1>Simple Page Title</h1>
      <p>This is a basic paragraph of text. Replace this with your own content.</p>
      <div class="alert">This is an alert box — good for notices or warnings.</div>
      <h2>Section Heading</h2>
      <ul class="plain">
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
      </ul>
      <button>Primary Button</button>
      <button class="secondary">Secondary Button</button>
    </div>
  </main>

  <footer>&copy; 2026 Simple Site. All rights reserved.</footer>

</body>
</html>
